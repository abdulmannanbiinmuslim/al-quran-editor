name: Build Debug APK and Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  actions: write

jobs:
  build-and-release:
    name: Build APK and Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      - name: Ensure environment file exists
        run: |
          if [ ! -f ./.env ]; then
            if [ -f ./.env.example ]; then
              cp ./.env.example ./.env
            else
              touch ./.env
            fi
          fi

      - name: Create temporary debug keystore
        run: |
          if [ ! -f ./debug.keystore ]; then
            if [ -f ./debug.keystore.base64 ]; then
              base64 -d ./debug.keystore.base64 > ./debug.keystore || true
            fi
          fi
          if [ ! -f ./debug.keystore ]; then
            keytool -genkey -v -keystore ./debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Make Gradle executable
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
          fi

      - name: Build debug APK
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew :app:assembleDebug --stacktrace --no-daemon
          else
            gradle :app:assembleDebug --stacktrace --no-daemon
          fi

      - name: Verify APK existence
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "Error: Expected debug APK not found at $APK_PATH"
            ls -R app/build/outputs/apk || true
            exit 1
          fi
          echo "APK verified successfully."

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          compression-level: 0
          if-no-files-found: error
          overwrite: true

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          mkdir -p release_asset_dir
          REPO_NAME=$(echo "${{ github.repository }}" | tr '/' '-' | tr '[:upper:]' '[:lower:]')
          cp app/build/outputs/apk/debug/app-debug.apk "release_asset_dir/app-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "release_asset_dir/${REPO_NAME}-build-${{ github.run_number }}.apk"
          
          # Create release notes file safely
          cat << 'EOF' > release_asset_dir/release_notes.md
          ## 📱 Al Quran App - Debug APK Release
          
          Direct installable APK build #${{ github.run_number }}.
          
          ### 📦 Download Links
          - **app-debug.apk** (Standard Debug APK)
          - **${REPO_NAME}-build-${{ github.run_number }}.apk**
          EOF
          
          ls -la release_asset_dir/

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="v${{ github.run_number }}"
          RELEASE_TITLE="Debug APK Release #${{ github.run_number }}"
          
          # Delete existing release/tag if any
          gh release delete "$TAG_NAME" --yes || true
          
          gh release create "$TAG_NAME" \
            release_asset_dir/*.apk \
            --title "$RELEASE_TITLE" \
            --notes-file release_asset_dir/release_notes.md \
            --clobber || true

      - name: Report APK download result
        run: |
          TAG_NAME="v${{ github.run_number }}"
          echo "### 🚀 APK Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Build Success**: Debug APK successfully generated and uploaded as Actions Artifact." >> $GITHUB_STEP_SUMMARY
          echo "📥 You can download \`app-debug-apk\` from this workflow run's **Artifacts** section or **Releases** page." >> $GITHUB_STEP_SUMMARY

