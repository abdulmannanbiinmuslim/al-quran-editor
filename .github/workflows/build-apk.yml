name: Build Debug APK and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check AGP Version in libs.versions.toml
        run: |
          if ! grep -q 'agp = "9.1.1"' gradle/libs.versions.toml; then
            echo "Error: AGP version is not exactly 9.1.1."
            exit 1
          fi
          echo "AGP version 9.1.1 confirmed."

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java and Kotlin Environment
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          JAVA_VERSION=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F'.' '{print $1}')
          if [ "$JAVA_VERSION" -lt 17 ]; then
            echo "Error: Java major version must be 17 or newer."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ ! -f ./debug.keystore ]; then
            keytool -genkey -v -keystore ./debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f ./debug.keystore ]; then
            echo "Error: Failed to create temporary debug keystore."
            exit 1
          fi

      - name: Make Gradle executable
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
          fi

      - name: Build debug APK
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew :app:assembleDebug --stacktrace --no-daemon
          else
            gradle :app:assembleDebug --stacktrace --no-daemon
          fi

      - name: Verify APK existence
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "Error: Expected debug APK not found at $APK_PATH"
            ls -R app/build/outputs/apk || true
            exit 1
          fi
          echo "APK verified successfully."

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          compression-level: 0
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          mkdir -p release_asset_dir
          REPO_NAME=$(echo "${{ github.repository }}" | tr '/' '-' | tr '[:upper:]' '[:lower:]')
          cp app/build/outputs/apk/debug/app-debug.apk "release_asset_dir/app-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "release_asset_dir/${REPO_NAME}-v${{ github.run_number }}.apk"
          echo "asset_path=release_asset_dir/*" >> $GITHUB_OUTPUT

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          
          gh release create "$TAG_NAME" \
            release_asset_dir/app-debug.apk \
            release_asset_dir/*.apk \
            --title "$RELEASE_TITLE" \
            --target "${{ github.sha }}" \
            --latest \
            --notes "Direct installable APK build #${{ github.run_number }}. Download app-debug.apk directly without unzipping."

      - name: Report APK download result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.publish_release.outcome }}" == "success" ]; then
            echo "Release publishing succeeded!"
            TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
            gh release view "$TAG_NAME"
            RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/$TAG_NAME"
            echo "Release Page URL: $RELEASE_URL"
            echo "The APK can be downloaded from the release Assets section." >> $GITHUB_STEP_SUMMARY
            echo "The normal Actions artifact (app-debug-apk) is also available as a backup." >> $GITHUB_STEP_SUMMARY
          else
            echo "Warning: Release publishing failed, but the APK build and artifact upload succeeded."
            echo "Warning: GitHub Release publishing failed, but the Actions artifact named app-debug-apk remains safely available." >> $GITHUB_STEP_SUMMARY
          fi
