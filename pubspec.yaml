name: al_quran_editor
description: "A comprehensive Flutter application for reading and listening to the Holy Quran with features like Surah reading, reciter audios, timing generators, planner, library, and topics."
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # State Management
  provider: ^6.4.0
  get: ^4.6.6
  
  # Navigation & Routing
  go_router: ^13.0.0
  
  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2
  sqflite: ^2.3.3+1
  
  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.15.3
  cloud_firestore: ^4.14.0
  google_sign_in: ^6.2.1
  
  # HTTP & Networking
  http: ^1.1.0
  dio: ^5.3.1
  retrofit: ^4.1.0
  json_serializable: ^6.7.1
  
  # JSON Serialization
  json_annotation: ^4.8.1
  
  # Audio
  just_audio: ^0.9.34
  audio_session: ^0.1.16
  
  # Utilities
  intl: ^0.19.0
  get_it: ^7.6.0
  logger: ^2.1.0
  freezed_annotation: ^2.4.1
  
  # UI Components
  flutter_svg: ^2.0.7
  cached_network_image: ^3.3.1
  smooth_page_indicator: ^1.1.0
  fl_chart: ^0.65.0
  
  # Notifications
  flutter_local_notifications: ^16.3.0
  timezone: ^2.1.1
  
  # Permissions
  permission_handler: ^11.4.4
  
  # Localization
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.6
  hive_generator: ^2.0.1
  retrofit_generator: ^8.1.0
  json_serializable: ^6.7.1
  freezed: ^2.4.1
  mockito: ^5.4.4
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/fonts/arabic/
    - assets/data/
    - assets/icons/
  
  fonts:
    - family: UthmanicHafs
      fonts:
        - asset: assets/fonts/arabic/UthmanicHafs.ttf
    - family: IndoPak
      fonts:
        - asset: assets/fonts/arabic/IndoPak.ttf
    - family: KFGQPC
      fonts:
        - asset: assets/fonts/arabic/KFGQPC.ttf
